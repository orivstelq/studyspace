name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_ADMIN_URL: postgresql://postgres:ci-owner-password@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:ci-owner-password@localhost:5432/studyspace_dev
      TEST_DIRECT_URL: postgresql://postgres:ci-owner-password@localhost:5432/studyspace_test
      DATABASE_URL: postgresql://studyspace_app:ci-app-password@localhost:5432/studyspace_dev
      FAVORITES_DATABASE_URL: postgresql://studyspace_saved:ci-saved-password@localhost:5432/studyspace_dev
      APP_BASE_URL: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Create isolated PostgreSQL databases and roles
        run: |
          psql "$POSTGRES_ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE studyspace_app LOGIN PASSWORD 'ci-app-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE studyspace_saved LOGIN PASSWORD 'ci-saved-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE DATABASE studyspace_dev;
          CREATE DATABASE studyspace_test;
          SQL

      - name: Apply committed migrations and runtime grants
        run: |
          npx prisma migrate deploy
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f scripts/grant-runtime-roles.sql
          DIRECT_URL="$TEST_DIRECT_URL" npx prisma migrate deploy
          psql "$TEST_DIRECT_URL" -v ON_ERROR_STOP=1 -f scripts/grant-runtime-roles.sql

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: PostgreSQL integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Dependency security audit
        run: npm audit
