name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_ADMIN_URL: postgresql://postgres:ci-owner-password@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:ci-owner-password@localhost:5432/studyspace_dev
      TEST_DIRECT_URL: postgresql://postgres:ci-owner-password@localhost:5432/studyspace_test
      DATABASE_URL: postgresql://studyspace_ci_app_login:ci-app-password@localhost:5432/studyspace_dev
      FAVORITES_DATABASE_URL: postgresql://studyspace_ci_saved_login:ci-saved-password@localhost:5432/studyspace_dev
      APP_BASE_URL: http://localhost:3000
      RATE_LIMIT_SECRET: ci-only-rate-limit-secret-with-at-least-32-characters
      TRUSTED_CLIENT_IP_SOURCE: shared

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Create isolated PostgreSQL databases and roles
        run: |
          psql "$POSTGRES_ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE studyspace_app NOLOGIN
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE studyspace_saved NOLOGIN
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE studyspace_maintenance NOLOGIN
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE studyspace_ci_app_login LOGIN PASSWORD 'ci-app-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE studyspace_ci_saved_login LOGIN PASSWORD 'ci-saved-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT studyspace_app TO studyspace_ci_app_login WITH INHERIT TRUE;
          GRANT studyspace_app TO studyspace_ci_app_login WITH SET FALSE;
          GRANT studyspace_saved TO studyspace_ci_saved_login WITH INHERIT TRUE;
          GRANT studyspace_saved TO studyspace_ci_saved_login WITH SET FALSE;
          CREATE DATABASE studyspace_dev;
          CREATE DATABASE studyspace_test;
          SQL

      - name: Verify PostgreSQL 18 and role inheritance
        run: |
          psql "$POSTGRES_ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF current_setting('server_version_num')::integer < 180000
               OR current_setting('server_version_num')::integer >= 190000 THEN
              RAISE EXCEPTION 'CI requires PostgreSQL 18.x, found %', current_setting('server_version');
            END IF;
            IF NOT EXISTS (
              SELECT 1
              FROM pg_catalog.pg_auth_members membership
              JOIN pg_catalog.pg_roles granted ON granted.oid = membership.roleid
              JOIN pg_catalog.pg_roles member ON member.oid = membership.member
              WHERE granted.rolname = 'studyspace_app'
                AND member.rolname = 'studyspace_ci_app_login'
                AND membership.inherit_option
                AND NOT membership.set_option
                AND NOT membership.admin_option
            ) THEN
              RAISE EXCEPTION 'CI application role membership is not least-privileged';
            END IF;
            IF NOT EXISTS (
              SELECT 1
              FROM pg_catalog.pg_auth_members membership
              JOIN pg_catalog.pg_roles granted ON granted.oid = membership.roleid
              JOIN pg_catalog.pg_roles member ON member.oid = membership.member
              WHERE granted.rolname = 'studyspace_saved'
                AND member.rolname = 'studyspace_ci_saved_login'
                AND membership.inherit_option
                AND NOT membership.set_option
                AND NOT membership.admin_option
            ) THEN
              RAISE EXCEPTION 'CI private-data role membership is not least-privileged';
            END IF;
          END
          $verify$;
          SQL

      - name: Apply committed migrations and runtime grants
        run: |
          npx prisma migrate deploy
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f scripts/grant-runtime-roles.sql
          DIRECT_URL="$TEST_DIRECT_URL" npx prisma migrate deploy
          psql "$TEST_DIRECT_URL" -v ON_ERROR_STOP=1 -f scripts/grant-runtime-roles.sql

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: PostgreSQL integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Load deterministic browser-test listings
        run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/data/san-marcos.sql

      - name: Public end-to-end tests
        run: npm run test:e2e

      - name: Dependency security audit
        run: npm audit

      - name: Validate staging verifier syntax
        run: node --check scripts/verify-staging.mjs
