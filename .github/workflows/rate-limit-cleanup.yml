name: Staging maintenance cleanup

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-rate-limit-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Delete one bounded batch per category
        env:
          MAINTENANCE_DATABASE_URL: ${{ secrets.MAINTENANCE_DATABASE_URL }}
          PGCONNECT_TIMEOUT: "15"
          PGGSSENCMODE: disable
          PGSSLMODE: verify-full
          PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$MAINTENANCE_DATABASE_URL" ]]; then
            echo "::error::The staging MAINTENANCE_DATABASE_URL secret is not configured."
            exit 1
          fi
          if [[ "$MAINTENANCE_DATABASE_URL" != postgresql://* && "$MAINTENANCE_DATABASE_URL" != postgres://* ]]; then
            echo "::error::MAINTENANCE_DATABASE_URL must be a PostgreSQL connection URL."
            exit 1
          fi
          if [[ "$MAINTENANCE_DATABASE_URL" =~ [\?\&](gssencmode|service|servicefile|sslmode|sslrootcert)= ]]; then
            echo "::error::Remove service, GSS, and SSL options from MAINTENANCE_DATABASE_URL; the workflow enforces verified TLS."
            exit 1
          fi
          test -r "$PGSSLROOTCERT"

          cleanup_counts="$(psql -X "$MAINTENANCE_DATABASE_URL" \
            --set=ON_ERROR_STOP=1 --quiet --tuples-only --no-align \
            --file=scripts/staging/verify-maintenance-connection.sql \
            --file=scripts/cleanup-maintenance.sql)"

          if [[ ! "$cleanup_counts" =~ ^[0-9]+\|[0-9]+\|[0-9]+\|[0-9]+$ ]]; then
            echo "::error::Cleanup did not return exactly four numeric deletion counts."
            exit 1
          fi
          IFS='|' read -r rate_count session_count report_count moderation_count <<< "$cleanup_counts"

          echo "Cleanup completed with bounded counts."
          {
            echo "### Staging maintenance cleanup"
            echo "- Expired rate-limit buckets: \`$rate_count\`"
            echo "- Expired application sessions: \`$session_count\`"
            echo "- Resolved reports past retention: \`$report_count\`"
            echo "- Moderation actions past retention: \`$moderation_count\`"
            echo "- Per-category batch limit: \`1000\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$rate_count" == "1000" || "$session_count" == "1000" || "$report_count" == "1000" || "$moderation_count" == "1000" ]]; then
            echo "::warning title=Maintenance cleanup batch full::Check recent runs; repeated full batches indicate a cleanup backlog."
            echo "- Result: at least one full batch; compare consecutive hourly run summaries for backlog." >> "$GITHUB_STEP_SUMMARY"
          fi
